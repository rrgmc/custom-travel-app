# Optional. Only when the user asks for a suggested schedule (/suggest-schedule).
schedule:
  - date: 2026-10-09
    destination: lisbon
    title: Arrival
    attractions: [senhora-monte]
    notes: Long flight — keep it light. Sunset at the viewpoint if there's energy left.

  - date: 2026-10-10
    destination: lisbon
    title: Castle and Alfama
    attractions: [sao-jorge, tram-28, taberna-sample]

  - date: 2026-10-11
    destination: lisbon
    title: Belém
    attractions: [jeronimos, pasteis-belem, belem-tower]
    notes: If it rains, swap for the Oceanário.

  - date: 2026-10-12
    destination: sintra
    title: Pena
    attractions: [pena-palace, piriquita]
    notes: Morning train from Lisbon Rossio, drop the bags, then up to Pena.

  - date: 2026-10-13
    destination: sintra
    title: Regaleira, then Porto
    attractions: [quinta-regaleira]
    notes: Back to Lisbon after lunch for the afternoon train.

  - date: 2026-10-14
    destination: porto
    title: River and port wine
    attractions: [ribeira, port-cellars, serra-pilar]

  - date: 2026-10-15
    destination: porto
    title: Center
    attractions: [livraria-lello, francesinha-sample]
    notes: Or the Douro Valley day trip instead.

  - date: 2026-10-16
    destination: porto
    title: Flight home
    notes: Leave for the airport by 09:00.
