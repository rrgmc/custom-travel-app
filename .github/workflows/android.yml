name: Android app

# Builds only when asked, to save Actions minutes (the repo is private): push a tag like `v1`
# for a Release, or run it by hand from the Actions tab. Validation already runs locally.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create releases on tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle # later builds skip most dependency downloads

      - run: npm ci

      # validate + icons + typecheck + web build + copy into android/ + apply trip identity
      - run: npm run android:sync

      # Stable signing, so new versions install over old ones: repository secrets if set, otherwise a
      # key committed to this (private) repo by `npm run signing:create`, otherwise a throwaway debug key.
      - name: Signing key
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            echo "$KS_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KS_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ -f android/signing/release.jks ]; then
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/signing/release.jks" >> "$GITHUB_ENV"
            grep -E '^ANDROID_[A-Z_]+=' android/signing/signing.env >> "$GITHUB_ENV"
          else
            echo "No signing key: building a debug APK (updates need an uninstall first)."
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew assembleRelease --no-daemon
            src=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew assembleDebug --no-daemon
            src=app/build/outputs/apk/debug/app-debug.apk
          fi
          id=$(node -e "console.log(require('yaml').parse(require('fs').readFileSync('../trip/trip.yaml','utf8')).trip.id)")
          mkdir -p ../out
          cp "$src" "../out/${id}-${VERSION_NAME}.apk"

      # Manual runs: short-lived artifact (artifact storage counts against the private-repo quota).
      # Tags: the Release below holds the APK instead.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: apk
          path: out/*.apk
          retention-days: 7

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
