name: Android app

# Builds only when asked, to save Actions minutes (the repo is private): push a tag like `v1`
# for a Release, or run it by hand from the Actions tab. Validation already runs locally.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create releases on tags

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle # later builds skip most dependency downloads

      - run: npm ci

      # validate + icons + typecheck + web build + copy into android/ + apply trip identity
      - run: npm run android:sync

      - name: Signing key
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            src=app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew assembleDebug --no-daemon
            src=app/build/outputs/apk/debug/app-debug.apk
          fi
          id=$(node -e "console.log(require('yaml').parse(require('fs').readFileSync('../trip/trip.yaml','utf8')).trip.id)")
          mkdir -p ../out
          cp "$src" "../out/${id}-${VERSION_NAME}.apk"

      # Manual runs: short-lived artifact (artifact storage counts against the private-repo quota).
      # Tags: the Release below holds the APK instead.
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: apk
          path: out/*.apk
          retention-days: 7

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
